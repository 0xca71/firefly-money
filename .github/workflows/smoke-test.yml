name: Smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build the scripts
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Start demo server
        run: python3 dev/mock_server.py &
      - name: Smoke test
        run: curl -sf --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8765/ && python3 dev/smoke_test.py
      - name: Start a slow, flaky demo server (1 in 10 reads fails with 502)
        run: LATENCY=0.1 FAIL_RATE=0.1 PORT=8766 python3 dev/mock_server.py &
      - name: Smoke test against the flaky server
        run: curl -sf --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8766/ && BASE=http://127.0.0.1:8766/ python3 dev/smoke_test.py
